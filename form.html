<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Receitas</title>
    <link rel="stylesheet" href="form.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>
    <div class="formulario">
        <h1>Cadastro</h1>

        <form id="meuFormulario">
            <label for="titulo">Receita:</label><br>
            <input type="text" id="titulo" name="titulo" required><br>

            <label for="paragrafo">Ingredientes e modo de preparo:</label><br>
            <textarea id="paragrafo" name="paragrafo" required></textarea><br>

            <label for="imagem">Imagem:</label><br>
            <input type="url" id="imagem" name="imagem" placeholder="URL da imagem" required><br>

            <label for="descricao">Descrição da imagem:</label><br>
            <input type="text" id="descricao" name="descricao" required><br>

            <div class="criar">
                <input type="submit" value="Criar">
            </div>
        </form>
    </div>

    <script src="scriptForm.js"></script>
</body>
</html>
