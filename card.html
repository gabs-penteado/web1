<!DOCTYPE html> <!-- informar ao navegador qual é a versão do HTML utilizada no arquivo -->>
<html lang="en"> <!-- informa o principal idioma do conteúdo de uma página web -->>
<head> <!-- providencia informações gerais sobre o documento, incluindo seu título e links para scripts e folhas de estilos -->>
    <meta charset="UTF-8"> <!--  serve para definir a codificação de caracteres do documento, garantindo que o navegador interprete e exiba corretamente letras acentuadas,
     símbolos e caracteres de diferentes idiomas (UTF-8 é o padrão universal). -->>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- serve para tornar o site responsivo, ajustando sua largura à tela do dispositivo (celular, tablet)
     e definindo o zoom inicial como 100% -->>
    <title>Document</title> <!-- Define o título do documento-->>
</head> <!-- fecha a tag head -->>
<body> <!-- tudo que será visível na tela-->>
    
</body> <!-- fecha a tag body-->>
</html> <!-- fecha a tag html-->>
 
<!-- !(tab)-> faz o cabeçalho sozinho -->>
